[graph]
all-features = false
no-default-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # The render path is hand written WGSL, no shader macro crates needed.
    { name = "wgpu-core", wrappers = ["naga"], reason = "naga must match the wgpu core version exactly" },
]
skip-tree = []

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses.private]
ignore = true