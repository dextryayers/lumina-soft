[workspace]
resolver = "2"
members = [
    "crates/lumina-core",
    "crates/lumina-config",
    "crates/lumina-platform",
    "crates/lumina-render",
    "crates/lumina-text",
    "crates/lumina-app",
    "crates/lumina-widgets",
    "crates/lumina-media",
    "crates/lumina-audio",
    "crates/lumina-color",
    "crates/lumina-ipc",
    "xtask",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/lumina-sh/lumina"
homepage = "https://github.com/lumina-sh/lumina"
authors = ["Lumina Contributors"]
categories = ["gui", "multimedia"]
keywords = ["dynamic-island", "overlay", "widget", "audio-visualizer"]

[workspace.dependencies]
# Internal crates, path dependencies only.
lumina-core = { path = "crates/lumina-core", version = "0.1.0-alpha.1" }
lumina-config = { path = "crates/lumina-config", version = "0.1.0-alpha.1" }
lumina-platform = { path = "crates/lumina-platform", version = "0.1.0-alpha.1" }
lumina-render = { path = "crates/lumina-render", version = "0.1.0-alpha.1" }
lumina-text = { path = "crates/lumina-text", version = "0.1.0-alpha.1" }
lumina-widgets = { path = "crates/lumina-widgets", version = "0.1.0-alpha.1" }
lumina-media = { path = "crates/lumina-media", version = "0.1.0-alpha.1" }
lumina-audio = { path = "crates/lumina-audio", version = "0.1.0-alpha.1" }
lumina-color = { path = "crates/lumina-color", version = "0.1.0-alpha.1" }
lumina-ipc = { path = "crates/lumina-ipc", version = "0.1.0-alpha.1" }

# Serialization and configuration.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
notify = "6.1"
toml_edit = "0.22"

# Platform.
winit = "0.30"
raw-window-handle = "0.6"
wgpu = "30.0"
pollster = "0.4"
naga = { version = "30.0", features = ["wgsl-in"] }

# Audio analysis.
rustfft = "6.2"

# Random-free test data generation is hand rolled; no external crates.

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Documented, deliberate exceptions.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
similar_names = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
too_many_lines = "allow"
# F32 math is intentional throughout the render and animation paths.
float_cmp = "allow"
# Window extended styles are 32 bit in the Win32 API, while `GetWindowLongPtrW`
# reads them through a pointer sized type. On a 64 bit target the widening is
# lossless and this cast is the documented pattern from the Microsoft samples.
cast_possible_wrap = "allow"
# The OkLab and WCAG coefficients below are the published reference values,
# written at full precision so they can be checked against the source document.
# Truncating them to f32 would hide a transcription error without changing the
# result, since the extra digits are discarded at compile time anyway.
excessive_precision = "allow"
# Brand and specification names read worse in backticks than they do in prose.
# "OkLab", "sRGB", "WCAG", "MPRIS", and "GSMTC" are proper nouns, not code
# items, and the lint has no way to express that.
doc_markdown = "allow"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
# Worker panics are contained with `catch_unwind`; abort would defeat that
# policy and take the island down when audio or media capture fails.
panic = "unwind"
strip = true

[profile.release-visual]
inherits = "release"
opt-level = 3
debug = true
panic = "unwind"

[profile.dev]
opt-level = 1