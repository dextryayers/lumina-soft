# High saturation cyan and magenta with a wide glow.
name = "Neon"

[appearance]
fill = "#05050BF5"
border_color = "#00E5FFAA"
corner_radius = 10.0
glow_spread = 20.0
glow_falloff = 5.0
border_width = 1.5

[rgb]
mode = "cycling"
primary = "#FF2D95"
secondary = "#00E5FF"
glow_intensity = 1.4
cycle_degrees_per_second = 25.0
