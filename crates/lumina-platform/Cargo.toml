[package]
name = "lumina-platform"
description = "Display server abstraction for Lumina: overlay windows, monitors, placement, click-through, hotkeys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
lumina-core = { workspace = true }
lumina-config = { workspace = true }

raw-window-handle = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# `allow-unsafe-code` is required because XCB requests are generated through a
# small amount of unchecked pointer work in the crate itself.
# `shape` provides the XShape extension used for click-through via an empty
# input region.
# `randr` provides XRandR, which is how monitors and their geometry are read.
x11rb = { version = "0.13", features = ["allow-unsafe-code", "shape", "randr", "libc"] }
libc = "0.2"
# Layer-shell is the only Wayland protocol that lets a client place a window,
# reserve screen space, and pass clicks through. xdg-shell is the fallback for
# compositors such as GNOME that do not implement it.
# The `system` backend is what exposes `wl_display` and `wl_surface` pointers,
# which wgpu needs to create a Vulkan or GL surface. `dlopen` keeps the crate
# buildable on machines that do not have libwayland development headers.
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
lumina-core = { workspace = true }