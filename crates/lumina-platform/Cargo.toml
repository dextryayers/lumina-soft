[package]
name = "lumina-platform"
description = "Display server abstraction for Lumina: overlay windows, monitors, placement, click-through, hotkeys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
lumina-core = { workspace = true }
lumina-config = { workspace = true }

raw-window-handle = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# `allow-unsafe-code` is required because XCB requests are generated through a
# small amount of unchecked pointer work in the crate itself.
# `shape` provides the XShape extension used for click-through via an empty
# input region.
# `randr` provides XRandR, which is how monitors and their geometry are read.
x11rb = { version = "0.13", features = ["allow-unsafe-code", "shape", "randr", "libc"] }

[dev-dependencies]
lumina-core = { workspace = true }